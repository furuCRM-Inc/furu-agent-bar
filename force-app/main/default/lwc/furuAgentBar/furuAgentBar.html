<template>
    <div class="furu-bar">

        <!-- ── Input card ─────────────────────────────────────────────── -->
        <div class={inputCardClass}
             ondragover={handleDragOver}
             ondragleave={handleDragLeave}
             ondrop={handleDrop}>

            <!-- Drop overlay — appears when dragging a file over the card -->
            <template lwc:if={isDragOver}>
                <div class="furu-bar__drop-overlay">
                    <span class="furu-bar__drop-icon">📄</span>
                    <span class="furu-bar__drop-label">名刺・書類をドロップ</span>
                </div>
            </template>

            <!-- OCR loading overlay -->
            <template lwc:if={isOcrLoading}>
                <div class="furu-bar__drop-overlay furu-bar__drop-overlay--ocr">
                    <div class="furu-bar__spinner furu-bar__spinner--lg"></div>
                    <span class="furu-bar__drop-label">Agentforce Vision 解析中...</span>
                    <span class="furu-bar__drop-file">📎 {_attachedFileName}</span>
                </div>
            </template>

            <!-- Context header -->
            <div class="furu-bar__header">
                <span class="furu-bar__logo" title="FlashBar for Salesforce">⚡</span>
                <span class="furu-bar__brand">FlashBar AI</span>
                <template lwc:if={contextLabel}>
                    <span class="furu-bar__ctx-pill">{contextLabel}</span>
                </template>
                <span class="furu-bar__spacer"></span>
                <template lwc:if={hasCredits}>
                    <span class="furu-bar__credits" title="無料AIクレジット残高">{creditLabel}</span>
                </template>
                <template lwc:if={charCount}>
                    <span class="furu-bar__charcount">{charCount}</span>
                </template>
                <template lwc:if={isAdmin}>
                    <button class="furu-bar__gear-btn" onclick={openSettings} title="ルール管理" type="button">
                        ⚙️<template lwc:if={pendingBadge}><span class="furu-bar__gear-badge">{pendingBadge}</span></template>
                    </button>
                </template>
            </div>

            <!-- Auto-expanding textarea -->
            <textarea
                class="furu-bar__textarea"
                placeholder={i18n.placeholder}
                oninput={handleInputAutoResize}
                onkeydown={handleKeyDown}
                oncompositionstart={handleCompositionStart}
                oncompositionend={handleCompositionEnd}
                disabled={isLoading}
            ></textarea>

            <!-- Quick-action chips -->
            <div class="furu-bar__chips">
                <template for:each={quickChips} for:item="chip">
                    <button
                        key={chip.key}
                        class="furu-bar__chip"
                        data-cmd={chip.cmd}
                        onclick={handleChip}
                        disabled={isLoading}
                        type="button"
                    >{chip.label}</button>
                </template>
            </div>

            <!-- Attachment badge — shown while OCR is running -->
            <template lwc:if={_attachedFileName}>
                <div class="furu-bar__attachment">
                    <span class="furu-bar__attachment-icon">📎</span>
                    <span class="furu-bar__attachment-name">{_attachedFileName}</span>
                    <button class="furu-bar__attachment-dismiss" onclick={dismissAttachment} type="button">✕</button>
                </div>
            </template>

            <!-- Footer: camera button + hint + submit -->
            <div class="furu-bar__footer">
                <label class="furu-bar__file-btn" title="名刺・書類をアップロード (JPG/PNG/PDF)">
                    📷
                    <input
                        class="furu-bar__file-input"
                        type="file"
                        accept="image/jpeg,image/png,image/webp,image/heic,application/pdf,.csv,text/csv"
                        onchange={handleFileSelect}
                    />
                </label>
                <span class="furu-bar__hint">{i18n.hint}</span>
                <template lwc:if={isAdmin}>
                    <button class="furu-bar__debug-toggle"
                            onclick={toggleDebugPanel}
                            type="button"
                            title="Admin Debug Panel">⚙</button>
                </template>
                <button
                    class="furu-bar__submit"
                    onclick={handleSubmit}
                    disabled={isLoading}
                    title="Run (Enter)"
                >
                    <template lwc:if={isLoading}>
                        <div class="furu-bar__spinner"></div>
                    </template>
                    <template lwc:else>↑</template>
                </button>
            </div>
        </div>

        <!-- ── Context Panel (ambient idle state) ──────────────────── -->
        <template lwc:if={showContextPanel}>
            <div class="furu-bar__ctx-panel">

                <!-- Section A: Field guide -->
                <template lwc:if={hasContextFields}>
                    <div class="furu-bar__ctx-section">
                        <div class="furu-bar__ctx-section-title">
                            <span>📋</span>
                            <span>{contextSectionTitle}</span>
                        </div>
                        <template for:each={contextFieldRows} for:item="f">
                            <div key={f.apiName} class="furu-bar__ctx-field">
                                <div class="furu-bar__ctx-field-top">
                                    <span class="furu-bar__ctx-field-icon">{f.statusIcon}</span>
                                    <span class="furu-bar__ctx-field-label">{f.label}</span>
                                    <template lwc:if={f.isRequired}>
                                        <span class="furu-bar__ctx-field-badge furu-bar__ctx-field-badge--req">{i18n.required}</span>
                                    </template>
                                    <template lwc:else>
                                        <span class="furu-bar__ctx-field-badge furu-bar__ctx-field-badge--opt">{i18n.optional}</span>
                                    </template>
                                    <template lwc:if={f.limitBadge}>
                                        <span class="furu-bar__ctx-field-badge furu-bar__ctx-field-badge--limit">{f.limitBadge}</span>
                                    </template>
                                </div>
                                <template lwc:if={f.exampleHint}>
                                    <p class="furu-bar__ctx-field-example">{f.exampleHint}</p>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Section B: Active semantic rules -->
                <template lwc:if={hasContextRules}>
                    <div class="furu-bar__ctx-section furu-bar__ctx-section--rules">
                        <div class="furu-bar__ctx-section-title">
                            <span>💡</span>
                            <span>{i18n.ctxRulesTitle}</span>
                        </div>
                        <template for:each={contextRuleRows} for:item="rule">
                            <div key={rule.id} class="furu-bar__ctx-rule">
                                <span class="furu-bar__ctx-rule-bullet">●</span>
                                <span class="furu-bar__ctx-rule-text">{rule.text}</span>
                            </div>
                        </template>
                    </div>
                </template>

            </div>
        </template>

        <!-- ── Child Record Quick-Action Chips ──────────────────────── -->
        <template lwc:if={hasChildActions}>
            <div class="furu-bar__child-actions">
                <span class="furu-bar__child-actions-label">{childActionsLabel}</span>
                <div class="furu-bar__child-actions-chips">
                    <template for:each={childActionChips} for:item="chip">
                        <button key={chip.key}
                                class="furu-bar__child-action-chip"
                                data-sobject={chip.sObject}
                                data-field={chip.field}
                                onclick={handleChildActionChip}
                                type="button">{chip.icon} {chip.label}</button>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── Analytics Creating State ─────────────────────────────── -->
        <template lwc:if={creatingAnalytics}>
            <div class="furu-bar__analytics-creating">
                <div class="furu-bar__spinner furu-bar__spinner--large"></div>
                <p class="furu-bar__analytics-creating-label">{analyticsCreatingLabel}</p>
            </div>
        </template>

        <!-- ── Analytics Result Card ─────────────────────────────────── -->
        <template lwc:if={hasAnalyticsResult}>
            <div class="furu-bar__analytics-result">
                <div class="furu-bar__analytics-result-header">
                    <span class="furu-bar__analytics-result-title">{analyticsSuccessTitle}</span>
                    <button class="furu-bar__analytics-dismiss" onclick={handleDismissAnalytics} type="button">✕</button>
                </div>
                <div class="furu-bar__analytics-result-body">
                    <template lwc:if={analyticsResult.reportName}>
                        <p class="furu-bar__analytics-name">📋 {analyticsResult.reportName}</p>
                    </template>
                    <template lwc:if={analyticsIsDashboard}>
                        <template lwc:if={analyticsResult.dashboardName}>
                            <p class="furu-bar__analytics-name">📊 {analyticsResult.dashboardName}</p>
                        </template>
                    </template>
                </div>
                <div class="furu-bar__analytics-result-actions">
                    <button class="furu-bar__action-btn furu-bar__action-btn--save"
                            onclick={handleOpenAnalyticsReport}
                            type="button">📋 レポートを開く</button>
                    <template lwc:if={analyticsIsDashboard}>
                        <template lwc:if={analyticsResult.dashboardId}>
                            <button class="furu-bar__action-btn furu-bar__action-btn--save"
                                    onclick={handleOpenAnalyticsDashboard}
                                    type="button">📊 ダッシュボードを開く</button>
                        </template>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── Record Summary Card ───────────────────────────────────── -->
        <template lwc:if={hasSummaryCard}>
            <div class="furu-bar__summary">
                <div class="furu-bar__summary-header">
                    <span class="furu-bar__summary-icon">📊</span>
                    <span class="furu-bar__summary-title">{summaryTitle}</span>
                    <button class="furu-bar__summary-edit-btn"
                            onclick={handleEditSummary}
                            title="Edit summary fields"
                            type="button">✏️</button>
                </div>

                <!-- Read mode — field values (summaryDisplayRows returns [] when editing) -->
                <div class="furu-bar__summary-fields">
                    <template for:each={summaryDisplayRows} for:item="f">
                        <div key={f.rowKey} class={f.cssClass}>
                            <span class="furu-bar__summary-label">{f.label}</span>
                            <template lwc:if={f.isRequired}>
                                <span class="furu-bar__summary-req">必須</span>
                            </template>
                            <span class="furu-bar__summary-value">{f.displayValue}</span>
                        </div>
                    </template>
                </div>
                <!-- Edit mode — incremental search + field selector + value editor -->
                <template lwc:if={_summaryEditing}>
                    <div class="furu-bar__vedit-search-wrap">
                        <input class="furu-bar__vedit-search"
                               type="text"
                               placeholder={veditSearchPlaceholder}
                               value={_fieldSearchKw}
                               oninput={handleFieldSearchInput} />
                    </div>
                    <div class="furu-bar__summary-editor">
                        <template for:each={filteredEditFields} for:item="f">
                            <div key={f.apiName} class="furu-bar__vedit-row">
                                <input type="checkbox"
                                       checked={f.isChecked}
                                       data-apiname={f.apiName}
                                       class="furu-bar__vedit-checkbox"
                                       onchange={handleSummaryFieldToggle} />
                                <span class="furu-bar__vedit-label">
                                    {f.label}
                                    <template lwc:if={f.isDirty}>
                                        <span class="furu-bar__vedit-dirty-badge" title="変更あり">✏️</span>
                                    </template>
                                </span>
                                <template lwc:if={f.isRequired}>
                                    <span class="furu-bar__summary-req">必須</span>
                                </template>
                                <template lwc:if={f.isTextField}>
                                    <input class="furu-bar__vedit-input"
                                           type={f.inputType}
                                           value={f.draftValue}
                                           placeholder={f.displayValue}
                                           data-apiname={f.apiName}
                                           oninput={handleFieldDraftChange} />
                                </template>
                                <template lwc:if={f.isCheckboxField}>
                                    <input class="furu-bar__vedit-toggle"
                                           type="checkbox"
                                           checked={f.draftValueBool}
                                           data-apiname={f.apiName}
                                           onchange={handleFieldDraftChange} />
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="furu-bar__summary-edit-actions">
                        <button class="furu-bar__action-btn furu-bar__action-btn--save"
                                onclick={handleSummarySave}
                                disabled={_savingSummary}
                                type="button">
                            <template lwc:if={_savingSummary}>
                                <div class="furu-bar__spinner"></div>
                            </template>
                            <template lwc:else>{summaryEditSaveLabel}</template>
                        </button>
                        <button class="furu-bar__action-btn"
                                onclick={handleEditSummary}
                                type="button">{i18n.cancel}</button>
                    </div>
                </template>
            </div>
        </template>

        <!-- ── Smart Suggestions: Recent Records & Prompts ─────────── -->
        <template lwc:if={showSuggestions}>
            <div class="furu-bar__suggestions">
                <template lwc:if={hasRecentRecords}>
                    <div class="furu-bar__sug-row">
                        <span class="furu-bar__sug-label">🕒 最近のレコード</span>
                        <div class="furu-bar__sug-chips">
                            <template for:each={recentRecordChips} for:item="c">
                                <button key={c.id}
                                        class="furu-bar__sug-chip furu-bar__sug-chip--record"
                                        data-id={c.id}
                                        data-type={c.type}
                                        onclick={handleRecordChip}
                                        type="button">{c.icon} {c.name}</button>
                            </template>
                        </div>
                    </div>
                </template>
                <template lwc:if={hasRecentPrompts}>
                    <div class="furu-bar__sug-row">
                        <span class="furu-bar__sug-label">💬 最近のプロンプト</span>
                        <div class="furu-bar__sug-chips">
                            <template for:each={recentPromptChips} for:item="c">
                                <button key={c.key}
                                        class="furu-bar__sug-chip furu-bar__sug-chip--prompt"
                                        data-prompt={c.text}
                                        onclick={handlePromptChip}
                                        type="button">⚡ {c.label}</button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- ── Navigation Hub (pinned queries & pages) ──────────────── -->
        <template lwc:if={hasNavItems}>
            <div class="furu-bar__nav-hub">
                <div class="furu-bar__nav-hub-label">📌 マイ・ナビゲーション</div>
                <div class="furu-bar__nav-hub-items">
                    <template for:each={navItemRows} for:item="nav">
                        <div key={nav.id} class="furu-bar__nav-item">
                            <button class="furu-bar__nav-item-btn"
                                    data-id={nav.id}
                                    onclick={handleNavItemClick}
                                    type="button">
                                <span class="furu-bar__nav-item-icon">{nav.icon}</span>
                                <span class="furu-bar__nav-item-label">{nav.label}</span>
                                <template lwc:if={nav.isListEditor}>
                                    <span class="furu-bar__nav-item-type">✏️</span>
                                </template>
                                <template lwc:if={nav.isPage}>
                                    <span class="furu-bar__nav-item-type">↗</span>
                                </template>
                            </button>
                            <button class="furu-bar__nav-item-del"
                                    data-id={nav.id}
                                    onclick={handleDeleteNavItem}
                                    type="button">✕</button>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── Pin Dialog ───────────────────────────────────────────── -->
        <template lwc:if={pinDialogOpen}>
            <div class="furu-bar__pin-dialog">
                <div class="furu-bar__pin-dialog-label">📌 ピン留め名を入力</div>
                <input type="text"
                       class="furu-bar__pin-input"
                       value={pinLabel}
                       placeholder="例: 今週の商談パイプライン"
                       oninput={handlePinLabelChange} />
                <div class="furu-bar__pin-dialog-actions">
                    <button class="furu-bar__soql-act-btn furu-bar__soql-act-btn--primary"
                            onclick={handlePinSave}
                            disabled={pinSaving}
                            type="button">
                        <template lwc:if={pinSaving}>⏳</template>
                        <template lwc:else>📌 保存</template>
                    </button>
                    <button class="furu-bar__soql-act-btn"
                            onclick={handleClosePinDialog}
                            type="button">キャンセル</button>
                </div>
            </div>
        </template>

        <!-- ── Personal Search Shortcuts (idle state) ───────────────── -->
        <template lwc:if={showShortcuts}>
            <div class="furu-bar__shortcuts">
                <div class="furu-bar__shortcuts-label">
                    <span>⭐</span>
                    <span>{soqlShortcutsLabel}</span>
                </div>
                <div class="furu-bar__shortcuts-chips">
                    <template for:each={shortcutChips} for:item="q">
                        <span key={q.idx} class="furu-bar__shortcut-chip">
                            <button class="furu-bar__shortcut-run"
                                    data-idx={q.idx}
                                    onclick={handleShortcutChip}
                                    type="button">⚡ {q.name}</button>
                            <button class="furu-bar__shortcut-del"
                                    data-idx={q.idx}
                                    onclick={handleDeleteShortcut}
                                    type="button">✕</button>
                        </span>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── Status bar ────────────────────────────────────────────── -->
        <template lwc:if={statusMessage}>
            <div class={statusClass}>
                <span class="furu-bar__status-icon">{statusIcon}</span>
                <span class="furu-bar__status-text">{statusMessage}</span>
                <template lwc:if={showUndo}>
                    <button class="furu-bar__pill-btn" onclick={handleUndo}>{i18n.undo}</button>
                </template>
                <button class="furu-bar__pill-btn furu-bar__pill-btn--muted" onclick={dismissStatus}>✕</button>
            </div>
        </template>

        <!-- ── Disambiguation Card ("Did You Mean?") ────────────────── -->
        <template lwc:if={hasDisambiguate}>
            <div class="furu-bar__disambig">
                <div class="furu-bar__disambig-header">
                    <span class="furu-bar__disambig-icon">🤔</span>
                    <span class="furu-bar__disambig-msg">{disambiguateMessage}</span>
                    <button class="furu-bar__pill-btn furu-bar__pill-btn--muted"
                            onclick={dismissDisambiguate} type="button">✕</button>
                </div>
                <ul class="furu-bar__disambig-list">
                    <template for:each={disambiguateCandidates} for:item="c">
                        <li key={c.key} class="furu-bar__disambig-item">
                            <button class="furu-bar__disambig-btn"
                                    data-idx={c.key}
                                    onclick={handleDisambiguateSelect}
                                    type="button">
                                <template lwc:if={c.isRecommended}>
                                    <span class="furu-bar__badge furu-bar__badge--recommended">{i18n.recommended}</span>
                                </template>
                                {c.label}
                            </button>
                        </li>
                    </template>
                </ul>
            </div>
        </template>

        <!-- ── Clarify Card ("I didn't understand — please clarify") ──── -->
        <template lwc:if={hasClarify}>
            <div class="furu-bar__clarify">
                <div class="furu-bar__clarify-header">
                    <span class="furu-bar__clarify-icon">❓</span>
                    <span class="furu-bar__clarify-msg">{clarifyMessage}</span>
                    <button class="furu-bar__pill-btn furu-bar__pill-btn--muted"
                            onclick={dismissClarify} type="button">✕</button>
                </div>
                <button class="furu-bar__clarify-sosl-btn"
                        onclick={handleClarifyKeywordSearch}
                        type="button">{i18n.keywordSearchFallback}</button>
            </div>
        </template>

        <!-- ── Search results ─────────────────────────────────────────── -->
        <template lwc:if={hasResults}>
            <div class="furu-bar__results">
                <div class="furu-bar__results-header">
                    <span>{resultCount} {i18n.results}</span>
                    <button class="furu-bar__pill-btn furu-bar__pill-btn--muted" onclick={dismissResults}>✕</button>
                </div>
                <ul class="furu-bar__result-list">
                    <template for:each={searchResults} for:item="row">
                        <li key={row.Id} class="furu-bar__result-row"
                            onclick={handleResultClick}
                            data-id={row.Id}
                            data-type={row.type}>
                            <span class="furu-bar__result-type">{row.type}</span>
                            <span class="furu-bar__result-name">{row.Name}</span>
                            <span class="furu-bar__result-sub">{row.sub}</span>
                        </li>
                    </template>
                </ul>
            </div>
        </template>

        <!-- ── Pre-fill / Extract / OCR Review Card ─────────────────── -->
        <template lwc:if={hasPrefill}>
            <div class="furu-bar__prefill">
                <div class="furu-bar__prefill-header">
                    <span class="furu-bar__prefill-title">{prefillTitle}</span>
                    <button class="furu-bar__pill-btn furu-bar__pill-btn--muted" onclick={dismissPrefill}>✕</button>
                </div>

                <!-- OCR metadata row (doc type + confidence + target switcher) -->
                <template lwc:if={prefillIsOcr}>
                    <div class="furu-bar__ocr-meta">
                        <span class="furu-bar__ocr-doctype">{prefillDocTypeIcon} {prefillDocTypeLabel}</span>
                        <span class="furu-bar__ocr-confidence">{prefillConfidenceLabel}</span>
                    </div>
                    <div class="furu-bar__ocr-targets">
                        <template for:each={prefillTargetOptions} for:item="opt">
                            <button key={opt.sObject}
                                    class={opt.cssClass}
                                    data-sobject={opt.sObject}
                                    onclick={handleOcrTargetSwitch}
                                    type="button">{opt.icon} {opt.label}</button>
                        </template>
                    </div>
                </template>

                <ul class="furu-bar__prefill-rows">
                    <template for:each={prefillItems} for:item="item">
                        <li key={item.apiName} class="furu-bar__prefill-row">
                            <span class="furu-bar__prefill-field">{item.apiName}</span>
                            <span class="furu-bar__prefill-arrow">→</span>
                            <span class="furu-bar__prefill-value">{item.displayValue}</span>
                        </li>
                    </template>
                </ul>
                <div class="furu-bar__prefill-actions">
                    <!-- OCR: labeled import button -->
                    <template lwc:if={prefillIsOcr}>
                        <button class="furu-bar__action-btn furu-bar__action-btn--save"
                                onclick={handleSavePrefill}
                                disabled={_ocrImporting}
                                type="button">
                            <template lwc:if={_ocrImporting}><div class="furu-bar__spinner"></div></template>
                            <template lwc:else>{prefillImportLabel}</template>
                        </button>
                    </template>
                    <!-- Standard prefill save -->
                    <template lwc:unless={prefillIsOcr}>
                        <button class="furu-bar__action-btn furu-bar__action-btn--save" onclick={handleSavePrefill}>{i18n.save}</button>
                    </template>
                    <button class="furu-bar__action-btn" onclick={dismissPrefill}>{i18n.discard}</button>
                </div>
            </div>
        </template>

        <!-- ── Knowledge Alert (learned validation rules) ───────────── -->
        <template lwc:if={hasKnowledgeAlert}>
            <div class="furu-bar__knowledge-alert">
                <div class="furu-bar__knowledge-header">
                    <span class="furu-bar__knowledge-title">{i18n.knowledgeTitle}</span>
                    <button class="furu-bar__pill-btn furu-bar__pill-btn--muted" onclick={dismissKnowledgeAlert}>✕</button>
                </div>
                <template for:each={knowledgeWarnings} for:item="w">
                    <p key={w} class="furu-bar__knowledge-rule">{w}</p>
                </template>
                <div class="furu-bar__knowledge-actions">
                    <button class="furu-bar__action-btn furu-bar__action-btn--save" onclick={handleKnowledgeProceed}>{i18n.proceed}</button>
                    <button class="furu-bar__action-btn" onclick={dismissKnowledgeAlert}>{i18n.cancel}</button>
                </div>
            </div>
        </template>

        <!-- ── Field Guide (GUIDE_CREATE) ────────────────────────────── -->
        <template lwc:if={hasGuide}>
            <div class="furu-bar__guide">
                <div class="furu-bar__guide-header">
                    <span class="furu-bar__guide-title">📋 {guideName}</span>
                    <button class="furu-bar__pill-btn furu-bar__pill-btn--muted" onclick={dismissGuide}>✕</button>
                </div>
                <!-- Parent-record resolver (auto-bind or search) -->
                <template lwc:if={hasParentState}>
                    <div class="furu-bar__parent-resolver">

                                                        <template lwc:if={cell.isPicklist}>
                                                            <select class="furu-bar__cell-input"

                                                                    <option key={opt.value}

                                                                            selected={opt.isSelected}>{opt.label}</option>
                                                                </template>
                                                            </select>
                                                        </template>
                                                        <template lwc:elseif={cell.isBoolean}>
                                                            <input type="checkbox"
                                                                   class="furu-bar__cell-check"
                                                                   data-record-id={row.id}
                                                                   data-api-name={cell.apiName}
                                                                   checked={cell.boolVal}
                                                                   onchange={handleTableCellChange} />
                                                        </template>
                                                        <template lwc:elseif={cell.isText}>
                                                            <input type={cell.inputType}
                                                                   class="furu-bar__cell-input"
                                                                   data-record-id={row.id}
                                                                   data-api-name={cell.apiName}
                                                                   value={cell.inputVal}
                                                                   onchange={handleTableCellChange} />
                                                        </template>
                                                        <template lwc:else>{cell.value}</template>
                                                    </template>
                                                    <template lwc:else>{cell.value}</template>
                                                </td>

                                                        data-id={row.id}
                                                        onclick={handleSoqlRecordNavigate}
                                                        type="button">↗</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>

                    <div class="furu-bar__approval-actions">
                        <button class="furu-bar__action-btn furu-bar__action-btn--save" onclick={handleApproveRule} type="button">✅ ワンタップ承認</button>
                        <button class="furu-bar__action-btn furu-bar__action-btn--edit" onclick={handleEditRule} type="button">✏️ 編集</button>
                        <button class="furu-bar__action-btn" onclick={handleRejectRule} type="button">✕ 拒否</button>
                    </div>
                </template>
            </div>
        </template>

        <!-- ── Admin: Settings Modal ──────────────────────────────────────── -->
        <template lwc:if={showSettings}>
            <div class="furu-bar__modal-backdrop" onclick={closeSettings}></div>
            <div class="furu-bar__modal">
                <div class="furu-bar__modal-header">
                    <span class="furu-bar__modal-title">⚙️ セマンティック辞書（学習ルール一覧）</span>
                    <button class="furu-bar__pill-btn furu-bar__pill-btn--muted" onclick={closeSettings} type="button">✕</button>
                </div>
                <template lwc:if={allRules.length}>
                    <ul class="furu-bar__modal-list">
                        <template for:each={allRules} for:item="rule">
                            <li key={rule.id} class="furu-bar__modal-rule">
                                <!-- Edit mode inside modal -->
                                <template lwc:if={_editingRuleId}>
                                    <template lwc:if={rule.isEditing}>
                                        <textarea class="furu-bar__approval-editor" value={_editingRuleText} oninput={handleEditRuleInput} rows="2"></textarea>
                                        <div class="furu-bar__approval-actions">
                                            <button class="furu-bar__action-btn furu-bar__action-btn--save" onclick={handleSaveModalEdit} type="button">保存</button>
                                            <button class="furu-bar__action-btn" onclick={handleCancelEdit} type="button">キャンセル</button>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <div class="furu-bar__modal-rule-top">
                                        <span class="furu-bar__modal-rule-status" data-status={rule.status}>{rule.status}</span>
                                        <span class="furu-bar__modal-rule-obj">{rule.sObjectType}</span>
                                        <label class="furu-bar__toggle">
                                            <input type="checkbox" checked={rule.isEnabled} data-id={rule.id} onchange={handleToggleRule} />
                                            <span class="furu-bar__toggle-slider"></span>
                                        </label>
                                    </div>
                                    <p class="furu-bar__modal-rule-text">{rule.ruleText}</p>
                                    <div class="furu-bar__modal-rule-meta">
                                        <span>{rule.createdDate}</span>
                                        <span>{rule.occurrences}回エラー</span>
                                        <button class="furu-bar__link-btn" data-id={rule.id} onclick={handleStartEditModal} type="button">✏️ 編集</button>
                                        <button class="furu-bar__link-btn furu-bar__link-btn--danger" data-id={rule.id} onclick={handleDeleteRule} type="button">🗑️ 削除</button>
                                    </div>
                                </template>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="furu-bar__modal-empty">このオブジェクトのルールはまだありません。</p>
                </template>

                <!-- Schema cache admin section -->
                <div class="furu-bar__modal-cache">
                    <div class="furu-bar__modal-cache-title">🗂️ メタデータキャッシュ（24h TTL）</div>
                    <button class="furu-bar__action-btn furu-bar__action-btn--cache"
                            onclick={handleRefreshSchemaCache}
                            disabled={_refreshingCache}
                            type="button">
                        <template lwc:if={_refreshingCache}>
                            <div class="furu-bar__spinner"></div>
                        </template>
                        <template lwc:else>🔄 メタデータキャッシュを今すぐ更新</template>
                    </button>
                    <p class="furu-bar__modal-cache-hint">{cacheRefreshHint}</p>
                </div>

                <!-- Dashboard Builder — Anthropic API key (admin sets once, all users benefit) -->
                <div class="furu-bar__modal-claude">
                    <div class="furu-bar__modal-claude-title">📊 Dashboard Builder（Claude AI）</div>
                    <template lwc:if={claudeConnected}>
                        <div class="furu-bar__claude-status furu-bar__claude-status--connected">
                            ✅ Anthropic APIキー設定済み — 全ユーザーが利用可能
                        </div>
                        <template lwc:if={isAdmin}>
                            <button class="furu-bar__action-btn furu-bar__action-btn--muted"
                                    onclick={handleDisconnectClaude}
                                    type="button">APIキーを削除</button>
                        </template>
                    </template>
                    <template lwc:else>
                        <template lwc:if={isAdmin}>
                            <p class="furu-bar__modal-claude-hint">
                                AnthropicのAPIキー（sk-ant-…）を入力してください。設定後は全ユーザーが自然言語でレポート・ダッシュボードを自動作成できます。
                            </p>
                            <div class="furu-bar__claude-key-row">
                                <input type="password"
                                       class="furu-bar__claude-key-input"
                                       placeholder="sk-ant-api03-..."
                                       value={_apiKeyInput}
                                       oninput={handleApiKeyInput} />
                                <button class="furu-bar__action-btn furu-bar__action-btn--claude"
                                        onclick={handleSaveApiKey}
                                        disabled={saveApiKeyDisabled}
                                        type="button">
                                    <template lwc:if={_savingApiKey}>
                                        <div class="furu-bar__spinner"></div>
                                    </template>
                                    <template lwc:else>{saveApiKeyLabel}</template>
                                </button>
                            </div>
                        </template>
                        <template lwc:else>
                            <p class="furu-bar__modal-claude-hint">
                                Dashboard Builderはまだ設定されていません。管理者にお問い合わせください。
                            </p>
                        </template>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── Admin Debug Panel ──────────────────────────────────────── -->
        <template lwc:if={hasDebugPanel}>
            <div class="furu-bar__debug-panel">
                <span class="furu-bar__debug-label">🛠 DEBUG</span>
                <span class="furu-bar__debug-item">Intent: <b>{debugInfo.intent}</b></span>
                <span class="furu-bar__debug-item">JEV: <b>{debugInfo.confidencePct}%</b></span>
                <span class="furu-bar__debug-item">Latency: <b>{debugInfo.latencyMs}ms</b></span>
                <span class="furu-bar__debug-item">sObj: <b>{debugInfo.sObject}</b></span>
            </div>
        </template>

    </div>

    <!-- ── Mass Editor Overlay ──────────────────────────────────────── -->
    <template lwc:if={_showMassEditor}>
        <c-furu-agent-mass-editor
            sobject-type={_sObjectType}
            records={massEditorRecords}
            field-names={massEditorFieldNames}
            onmasseditorclose={handleMassEditorClose}>
        </c-furu-agent-mass-editor>
    </template>

    <!-- ── Lead Assigner Overlay (Task 3) ─────────────────────────────── -->
    <template lwc:if={_showLeadAssigner}>
        <c-furu-agent-lead-assigner
            records={leadAssignerRecords}
            onleadassignerclose={handleLeadAssignerClose}>
        </c-furu-agent-lead-assigner>
    </template>

</template>
